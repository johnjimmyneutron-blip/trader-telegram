name: Trader Telegram

# Saatler UTC. New York'un yaz ve kis saatini birlikte kapsar; hangi isin
# yapilacagina script New York saatine bakarak kendisi karar verir.
on:
  schedule:
    - cron: "3-58/5 13-15 * * 1-5"    # acilis oncesi ve ilk saat: 5 dakikada bir
    - cron: "8-53/15 16-20 * * 1-5"   # gunun kalani: 15 dakikada bir
  workflow_dispatch:
    inputs:
      test:
        description: "Deneme mesaji gonder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: trader-telegram
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - name: Deneme mesaji
        if: github.event_name == 'workflow_dispatch' && inputs.test
        run: python3 telegram_notify.py test

      - name: Tur
        run: python3 telegram_notify.py run

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add -A trader
          git diff --cached --quiet || (git commit -q -m "durum" && git push -q)
